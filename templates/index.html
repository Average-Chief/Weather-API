<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <title>Weather API</title>
</head>
<body>
    <div class="container">
    <h1>Weather API</h1>
    <hr>

    <form method="POST" action="{{ url_for('get_weather') }}">
        <div class="form-group">
            <label for="city">Enter the City</label><br>
            <input id="city" type="text" name="city" required>
        </div>

        <div class="form-group">
            <label for="start_date">Enter the Start Date</label><br>
            <input id="start_date" type="date" name="start_date" required>
        </div>

        <div class="form-group">
            <label for="end_date">Enter the End Date</label><br>
            <input id="end_date" type="date" name="end_date" required>
        </div>

        <div class="form-group button-group">
            <button type="submit" class="btn">Get Result</button>
        </div>
    </form>

        {% if result %}
            <h3>Result</h3>
            <pre>{{ result | tojson(indent=2) }}</pre>
        {% endif %}

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
